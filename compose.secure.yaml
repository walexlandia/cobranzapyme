services:
  api:
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?DOCUMENT_ENCRYPTION_KEY is required}
    command: sh -c "alembic upgrade head && python -m app.encrypt_documents && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports: !reset []

  web:
    environment:
      NEXT_PUBLIC_API_URL: ""
    command: npm run dev -- --hostname 0.0.0.0
    ports: !reset []

  gateway:
    image: nginx:latest
    ports:
      - "8443:443"
    volumes:
      - ./infra/nginx/recupera.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
