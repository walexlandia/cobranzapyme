name: recupera

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recupera}
      POSTGRES_USER: ${POSTGRES_USER:-recupera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recupera_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recupera} -d ${POSTGRES_DB:-recupera}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-recupera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-recupera_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://recupera:recupera_dev_only@db:5432/recupera}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-pilot}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://recupera:recupera_dev_only@db:5432/recupera}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-pilot}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    command: python -m app.worker
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-recupera}
      PGUSER: ${POSTGRES_USER:-recupera}
      PGPASSWORD: ${POSTGRES_PASSWORD:-recupera_dev_only}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    command: >-
      sh -c 'while true; do
      stamp=$$(date -u +%Y%m%dT%H%M%SZ);
      pg_dump --format=custom --file=/backups/recupera-$${stamp}.dump;
      find /backups -type f -name "recupera-*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete;
      sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  test_db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: recupera_test
      POSTGRES_USER: recupera_test
      POSTGRES_PASSWORD: recupera_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recupera_test -d recupera_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test:
    build:
      context: ./backend
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://recupera_test:recupera_test@test_db:5432/recupera_test
      JWT_SECRET: test-secret-that-is-at-least-thirty-two-characters
      ENVIRONMENT: test
    command: sh -c "alembic upgrade head && pytest -q"
    volumes:
      - ./backend:/app
    depends_on:
      test_db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  web_node_modules:

